<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TOKI RIFT — Anime Time Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Pirata+One&family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&family=Cinzel+Decorative:wght@700&family=Noto+Serif+JP:wght@300;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

/* ═══ THEMES ═══ */
body{
  --bg:#0d0a04;
  --bg2:#1a1205;
  --panel:rgba(20,14,4,0.95);
  --border:rgba(212,160,23,0.3);
  --border2:rgba(212,160,23,0.12);
  --primary:#d4a017;
  --secondary:#e8312a;
  --accent:#1a8fff;
  --text:#f5e6c8;
  --text2:#c4a96a;
  --muted:#7a6a45;
  --gone:#e8312a;
  --left:#1a8fff;
  --now:#f5c542;
  --glow1:rgba(212,160,23,0.5);
  --glow2:rgba(232,49,42,0.5);
  --font-display:'Pirata One',cursive;
  --font-body:'Cinzel',serif;
  --font-mono:'Share Tech Mono',monospace;
  --particle:⚓;
  --theme-name:ONE PIECE;
  --bg-pattern:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4a017' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  transition:background 0.6s,color 0.6s;
  background:var(--bg) var(--bg-pattern);
  color:var(--text);
  font-family:var(--font-mono);
  min-height:100vh;
  overflow-x:hidden;
}

/* NARUTO theme */
body.theme-naruto{
  --bg:#08060f;
  --bg2:#100d1a;
  --panel:rgba(10,8,20,0.95);
  --border:rgba(255,140,0,0.3);
  --border2:rgba(255,140,0,0.1);
  --primary:#ff8c00;
  --secondary:#cc0000;
  --accent:#ffffff;
  --text:#fff8f0;
  --text2:#ffb347;
  --muted:#7a5a30;
  --gone:#cc0000;
  --left:#ff8c00;
  --now:#ffff00;
  --glow1:rgba(255,140,0,0.6);
  --glow2:rgba(204,0,0,0.5);
  --font-display:'Orbitron',sans-serif;
  --font-body:'Rajdhani',sans-serif;
  --particle:🍃;
  --theme-name:NARUTO;
  --bg-pattern:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 3l3 9h9l-7 5 3 9-8-5-8 5 3-9-7-5h9z' fill='%23ff8c00' fill-opacity='0.04'/%3E%3C/svg%3E");
}

/* DRAGON BALL Z theme */
body.theme-dbz{
  --bg:#060a14;
  --bg2:#0a1020;
  --panel:rgba(6,10,20,0.95);
  --border:rgba(255,200,0,0.35);
  --border2:rgba(255,200,0,0.1);
  --primary:#ffc800;
  --secondary:#ff6600;
  --accent:#00aaff;
  --text:#ffffff;
  --text2:#ffd966;
  --muted:#5a6a8a;
  --gone:#ff6600;
  --left:#00aaff;
  --now:#ffc800;
  --glow1:rgba(255,200,0,0.7);
  --glow2:rgba(255,102,0,0.5);
  --font-display:'Orbitron',sans-serif;
  --font-body:'Rajdhani',sans-serif;
  --particle:⚡;
  --theme-name:DRAGON BALL Z;
  --bg-pattern:url("data:image/svg+xml,%3Csvg width='50' height='50' viewBox='0 0 50 50' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='25' cy='25' r='20' fill='none' stroke='%23ffc800' stroke-opacity='0.04' stroke-width='1'/%3E%3Ccircle cx='25' cy='25' r='3' fill='%23ffc800' fill-opacity='0.04'/%3E%3C/svg%3E");
}

/* DEMON SLAYER theme */
body.theme-demonslayer{
  --bg:#03050a;
  --bg2:#070310;
  --panel:rgba(3,5,10,0.96);
  --border:rgba(220,60,60,0.3);
  --border2:rgba(220,60,60,0.1);
  --primary:#dc3c3c;
  --secondary:#7b2ff7;
  --accent:#00e5ff;
  --text:#f0e8ff;
  --text2:#c090ff;
  --muted:#5a4a7a;
  --gone:#dc3c3c;
  --left:#00e5ff;
  --now:#7b2ff7;
  --glow1:rgba(220,60,60,0.5);
  --glow2:rgba(123,47,247,0.5);
  --font-display:'Cinzel Decorative',cursive;
  --font-body:'Noto Serif JP',serif;
  --particle:🌸;
  --theme-name:DEMON SLAYER;
  --bg-pattern:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 C35 15 55 15 50 30 C55 45 35 45 30 55 C25 45 5 45 10 30 C5 15 25 15 30 5z' fill='%23dc3c3c' fill-opacity='0.03'/%3E%3C/svg%3E");
}

/* ATTACK ON TITAN theme */
body.theme-aot{
  --bg:#0a0a08;
  --bg2:#111108;
  --panel:rgba(10,10,8,0.96);
  --border:rgba(180,160,100,0.3);
  --border2:rgba(180,160,100,0.1);
  --primary:#b4a064;
  --secondary:#8b4513;
  --accent:#c8c8a0;
  --text:#e8e0c8;
  --text2:#b4a064;
  --muted:#6a6050;
  --gone:#8b4513;
  --left:#b4a064;
  --now:#e8e0c8;
  --glow1:rgba(180,160,100,0.4);
  --glow2:rgba(139,69,19,0.5);
  --font-display:'Cinzel',serif;
  --font-body:'Cinzel',serif;
  --particle:⚔️;
  --theme-name:ATTACK ON TITAN;
  --bg-pattern:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='35' y='10' width='10' height='60' fill='%23b4a064' fill-opacity='0.04'/%3E%3Crect x='10' y='35' width='60' height='10' fill='%23b4a064' fill-opacity='0.04'/%3E%3Ccircle cx='40' cy='40' r='15' fill='none' stroke='%23b4a064' stroke-opacity='0.04' stroke-width='1'/%3E%3C/svg%3E");
}

/* ═══ CANVAS BG ═══ */
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.7}

/* ═══ SCANLINES ═══ */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:998;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  animation:scanMove 12s linear infinite;
}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 200px}}

/* ═══ VIGNETTE ═══ */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:997;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.75) 100%);
}

/* ═══ APP WRAPPER ═══ */
.app{position:relative;z-index:10;max-width:480px;margin:0 auto;padding:0 14px 120px}

/* ═══ HEADER ═══ */
.header{
  text-align:center;padding:32px 0 24px;
  position:relative;
}
.theme-badge{
  display:inline-block;
  background:var(--primary);
  color:var(--bg);
  font-family:var(--font-body);
  font-size:8px;font-weight:700;
  letter-spacing:3px;
  padding:4px 12px;border-radius:20px;
  margin-bottom:10px;
  text-transform:uppercase;
  box-shadow:0 0 16px var(--glow1);
}
.app-title{
  font-family:var(--font-display);
  font-size:40px;line-height:1;
  color:var(--primary);
  text-shadow:0 0 30px var(--glow1),0 2px 0 rgba(0,0,0,0.8);
  letter-spacing:4px;
  margin-bottom:6px;
  animation:titlePulse 4s ease-in-out infinite;
}
@keyframes titlePulse{
  0%,100%{text-shadow:0 0 20px var(--glow1),0 2px 0 rgba(0,0,0,0.8)}
  50%{text-shadow:0 0 40px var(--glow1),0 0 60px var(--glow2),0 2px 0 rgba(0,0,0,0.8)}
}
.app-subtitle{
  font-family:var(--font-body);
  font-size:9px;color:var(--text2);
  letter-spacing:4px;text-transform:uppercase;
}

/* ═══ THEME SWITCHER ═══ */
.theme-switcher{
  display:flex;gap:8px;justify-content:center;
  margin-bottom:20px;flex-wrap:wrap;
}
.theme-pill{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:6px 14px;
  font-family:var(--font-body);
  font-size:9px;letter-spacing:2px;
  color:var(--muted);
  cursor:pointer;
  transition:all 0.25s;
  white-space:nowrap;
}
.theme-pill:hover{border-color:var(--border);color:var(--text2)}
.theme-pill.active{
  background:var(--primary);color:var(--bg);
  border-color:var(--primary);
  box-shadow:0 0 14px var(--glow1);
  font-weight:700;
}

/* ═══ PANEL ═══ */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--primary),var(--secondary),transparent);
  opacity:0.7;
}
.section-label{
  font-family:var(--font-body);
  font-size:9px;color:var(--text2);
  letter-spacing:3px;text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.section-label::before{content:'◆';color:var(--primary);font-size:8px}

/* ═══ DATE INPUTS ═══ */
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date-field label{
  display:block;
  font-family:var(--font-body);
  font-size:8px;color:var(--text2);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;
}
.date-field input[type="date"]{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1.5px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-family:var(--font-mono);
  font-size:13px;
  padding:12px 14px;
  outline:none;
  transition:border-color 0.3s,box-shadow 0.3s;
  -webkit-appearance:none;
}
.date-field input:focus{
  border-color:var(--primary);
  box-shadow:0 0 14px var(--glow1);
  background:rgba(255,255,255,0.07);
}
.date-field input::-webkit-calendar-picker-indicator{
  filter:invert(0.7) sepia(1) saturate(2) hue-rotate(10deg);
  cursor:pointer;width:18px;height:18px;
}

/* ═══ MODE GRID ═══ */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode-btn{
  background:rgba(255,255,255,0.04);
  border:1.5px solid var(--border2);
  border-radius:10px;
  padding:14px 6px 10px;
  text-align:center;cursor:pointer;
  transition:all 0.25s;
  position:relative;overflow:hidden;
}
.mode-btn:hover{
  border-color:var(--border);
  background:rgba(255,255,255,0.07);
  transform:translateY(-2px);
}
.mode-btn.active{
  border-color:var(--primary);
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 18px var(--glow1),inset 0 0 12px rgba(255,255,255,0.03);
}
.mode-icon{font-size:24px;display:block;margin-bottom:6px}
.mode-name{
  font-family:var(--font-body);
  font-size:8px;letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);display:block;
}
.mode-btn.active .mode-name{color:var(--text)}

/* ═══ CONTROLS ROW ═══ */
.controls-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding-top:14px;
  border-top:1px solid var(--border2);
  gap:12px;flex-wrap:wrap;
}
.sound-ctrl{display:flex;align-items:center;gap:8px}
.ctrl-label{
  font-family:var(--font-body);
  font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;
}
.toggle{
  width:42px;height:24px;
  background:rgba(255,255,255,0.06);
  border:1.5px solid var(--border);
  border-radius:12px;
  position:relative;cursor:pointer;
  transition:all 0.3s;
}
.toggle.on{
  background:rgba(255,255,255,0.1);
  border-color:var(--primary);
  box-shadow:0 0 12px var(--glow1);
}
.toggle::after{
  content:'';position:absolute;
  width:16px;height:16px;
  background:var(--muted);
  border-radius:50%;top:3px;left:3px;
  transition:all 0.3s;
}
.toggle.on::after{transform:translateX(18px);background:var(--primary);box-shadow:0 0 8px var(--glow1)}

/* ═══ INVOKE BUTTON ═══ */
.invoke-btn{
  width:100%;
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);
  border:none;border-radius:12px;
  color:var(--bg);
  font-family:var(--font-display);
  font-size:16px;letter-spacing:3px;
  padding:18px;cursor:pointer;
  transition:all 0.2s;
  margin-bottom:18px;
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px var(--glow1),0 2px 0 rgba(0,0,0,0.4);
  font-weight:700;
  text-shadow:0 1px 0 rgba(0,0,0,0.3);
}
.invoke-btn::before{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transition:left 0.5s;
}
.invoke-btn:hover::before{left:100%}
.invoke-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 32px var(--glow1),0 2px 0 rgba(0,0,0,0.4);
}
.invoke-btn:active{transform:translateY(0)}

/* ═══ VIZ AREA ═══ */
#vizArea{
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:22px 18px;
  display:none;overflow:hidden;
  position:relative;
}
#vizArea.visible{display:block;animation:openViz 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes openViz{
  from{opacity:0;transform:scale(0.95) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
#vizArea::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--primary),var(--secondary),transparent);
}

/* VIZ content */
.viz-eyebrow{
  font-family:var(--font-body);
  font-size:9px;color:var(--text2);
  letter-spacing:4px;text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.viz-eyebrow::before{content:'▶';color:var(--primary);font-size:8px}
.viz-number{
  font-family:var(--font-display);
  font-size:58px;line-height:1;
  color:var(--primary);
  text-shadow:0 0 24px var(--glow1),0 2px 0 rgba(0,0,0,0.8);
  margin-bottom:6px;
  letter-spacing:-1px;
}
.viz-unit{
  font-family:var(--font-body);
  font-size:14px;color:var(--text2);
  text-shadow:none;margin-left:8px;
  letter-spacing:2px;
}
.viz-sub{
  font-family:var(--font-mono);
  font-size:11px;color:var(--text2);
  margin-bottom:18px;letter-spacing:1px;
  line-height:1.6;
}

/* ─ BLOCKS ─ */
.blocks-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.bl{
  width:14px;height:14px;border-radius:3px;
  cursor:default;transition:transform 0.15s,box-shadow 0.15s;
}
.bl:hover{transform:scale(1.6);z-index:2}
.bl.gone{background:var(--gone);box-shadow:0 0 5px var(--glow2)}
.bl.left{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15)}
.bl.now{background:var(--now);box-shadow:0 0 10px var(--glow1),0 0 20px var(--glow1);animation:nowB 1.2s ease-in-out infinite}
@keyframes nowB{0%,100%{box-shadow:0 0 8px var(--glow1)}50%{box-shadow:0 0 20px var(--glow1),0 0 35px var(--glow2)}}
.bl-legend{display:flex;gap:14px;margin-top:10px;font-family:var(--font-body);font-size:8px;letter-spacing:2px;flex-wrap:wrap}
.bl-li{display:flex;align-items:center;gap:5px;color:var(--text2)}
.bl-dot{width:10px;height:10px;border-radius:2px}

/* ─ HOURGLASS ─ */
.hg-wrap{display:flex;justify-content:center;margin-top:10px;position:relative}
#hgCanvas{filter:drop-shadow(0 0 12px var(--primary))}
.hg-info{
  position:absolute;bottom:-50px;left:0;right:0;
  text-align:center;
}
.hg-pct-val{
  font-family:var(--font-display);font-size:28px;
  color:var(--now);text-shadow:0 0 16px var(--glow1);
}
.hg-pct-label{font-family:var(--font-body);font-size:8px;color:var(--text2);letter-spacing:3px;margin-top:2px}

/* ─ RINGS ─ */
.rings-wrap{display:flex;justify-content:center;margin-top:10px;position:relative}
#ringsCanvas{}
.rings-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);text-align:center;
}
.rings-pct{font-family:var(--font-display);font-size:34px;color:var(--primary);text-shadow:0 0 20px var(--glow1)}
.rings-lbl{font-family:var(--font-body);font-size:8px;color:var(--text2);letter-spacing:3px;margin-top:4px}

/* ─ CALENDAR ─ */
.cal-header-row{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
}
.cal-month-name{
  font-family:var(--font-display);font-size:18px;
  color:var(--primary);text-shadow:0 0 12px var(--glow1);letter-spacing:2px;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hdr{
  font-family:var(--font-body);font-size:8px;text-align:center;
  color:var(--text2);padding:3px;letter-spacing:1px;
}
.cal-day{
  aspect-ratio:1;border-radius:5px;
  font-family:var(--font-mono);font-size:9px;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s;cursor:default;
  border:1px solid transparent;
}
.cal-day:hover{transform:scale(1.25);z-index:2}
.cal-day.gone{background:rgba(232,49,42,0.2);color:#ff9090;border-color:rgba(232,49,42,0.25)}
.cal-day.left{background:rgba(255,255,255,0.04);color:var(--text2);border-color:rgba(255,255,255,0.06)}
.cal-day.today{background:var(--primary);color:var(--bg);font-weight:700;box-shadow:0 0 12px var(--glow1);border-color:transparent}
.cal-day.empty{background:transparent;border-color:transparent}

/* ─ TIMELINE ─ */
.tl-bar-outer{
  height:10px;background:rgba(255,255,255,0.06);
  border-radius:5px;overflow:hidden;margin-bottom:8px;
  border:1px solid var(--border2);position:relative;
}
.tl-fill{
  height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--gone),var(--now));
  transition:width 1.2s cubic-bezier(0.4,0,0.2,1);
  position:relative;
}
.tl-cursor{
  position:absolute;right:-9px;top:-5px;
  width:20px;height:20px;border-radius:50%;
  background:var(--now);
  box-shadow:0 0 14px var(--glow1),0 0 28px var(--glow2);
  border:2px solid var(--bg);
  animation:tlP 1s ease-in-out infinite;
}
@keyframes tlP{0%,100%{box-shadow:0 0 12px var(--glow1)}50%{box-shadow:0 0 24px var(--glow1),0 0 40px var(--glow2)}}
.tl-dates{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--text2);margin-top:6px}
.tl-now-lbl{color:var(--now)}
.mb-row{margin-bottom:14px}
.mb-labels{display:flex;justify-content:space-between;font-family:var(--font-body);font-size:8px;color:var(--text2);letter-spacing:2px;margin-bottom:5px}
.mb-track{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;border:1px solid var(--border2)}
.mb-fill{height:100%;border-radius:3px;transition:width 1.4s ease}

/* ─ SECONDS ─ */
.sec-wrap{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.sec-count{
  font-family:var(--font-display);
  font-size:44px;letter-spacing:-1px;
  color:var(--text);
  text-shadow:0 0 20px var(--glow2),0 0 40px var(--glow1),0 2px 0 rgba(0,0,0,0.8);
  text-align:center;margin-top:8px;
  animation:secPulse 1s ease-in-out infinite;
}
@keyframes secPulse{0%,100%{text-shadow:0 0 15px var(--glow2)}50%{text-shadow:0 0 30px var(--glow2),0 0 50px var(--glow1)}}
.sec-lbl{font-family:var(--font-body);font-size:9px;color:var(--text2);letter-spacing:3px;text-align:center;margin-top:4px}

/* ─ STATS ROW ─ */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat-box{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border2);
  border-radius:8px;padding:14px 8px;text-align:center;
  transition:border-color 0.3s;
}
.stat-box:hover{border-color:var(--border)}
.stat-val{
  font-family:var(--font-display);font-size:22px;
  color:var(--primary);
  text-shadow:0 0 10px var(--glow1);
  display:block;
}
.stat-label{
  font-family:var(--font-body);font-size:8px;
  color:var(--text2);letter-spacing:2px;text-transform:uppercase;
  margin-top:4px;display:block;line-height:1.4;
}

/* ─ TICKER ─ */
.ticker{
  margin-top:14px;padding:10px 14px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border2);
  border-radius:8px;
  font-family:var(--font-mono);font-size:10px;
  color:var(--text2);letter-spacing:1px;line-height:1.5;
}
.ticker strong{color:var(--primary)}

/* ─ LEGEND ─ */
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:8px;letter-spacing:2px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ═══ MINI BOT ═══ */
#botBtn{
  position:fixed;bottom:24px;right:18px;z-index:500;
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  border:none;cursor:pointer;
  box-shadow:0 4px 20px var(--glow1),0 2px 0 rgba(0,0,0,0.4);
  font-size:26px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;
  animation:botFloat 3s ease-in-out infinite;
}
@keyframes botFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#botBtn:hover{transform:scale(1.1);box-shadow:0 6px 28px var(--glow1)}
#botBtn.open{animation:none;transform:scale(1.05)}

#botChat{
  position:fixed;bottom:92px;right:18px;z-index:499;
  width:300px;
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  display:none;
  flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,0.6),0 0 24px var(--glow1);
  max-height:440px;
}
